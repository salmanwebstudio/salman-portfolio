<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Owner panel | Saffron & Sage</title>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <script defer src="js/data.js"></script>
    <script defer src="js/app.js"></script>
    <script defer src="js/motion.js"></script>
</head>

<body data-page="admin">
    <div id="site-header"></div>
    <main>
        <section class="page-hero compact">
            <div class="section-kicker">PRIVATE AREA</div>
            <h1>Owner <em>panel</em></h1>
            <p>Manage this browser's local demo data.</p>
        </section>
        <section class="section">
            <div id="admin-login" class="form-card admin-login admin-reveal">
                <h2>Admin sign in</h2>
                <form id="admin-login-form"><label>Password<input name="password" type="password" required
                            autocomplete="current-password"></label><button class="btn btn-primary" type="submit">Sign
                        in</button>
                    <p class="form-message" aria-live="polite"></p>
                </form>
                <p class="small-note">Demo password is in <code>js/data.js</code>. Change before sharing.</p>
            </div>
            <div id="admin-dashboard" class="admin-dashboard admin-dashboard-reveal" hidden>
                <div class="admin-top">
                    <div>
                        <div class="section-kicker">DASHBOARD</div>
                        <h2>Welcome back</h2>
                    </div><button id="admin-logout" class="btn btn-outline">Log out</button>
                </div>
                <div class="admin-tabs"><button class="filter-btn active" data-tab="products">Menu items</button><button
                        class="filter-btn" data-tab="orders">Orders</button><button class="filter-btn"
                        data-tab="reservations">Reservations</button><button class="filter-btn"
                        data-tab="messages">Messages</button><button class="filter-btn"
                        data-tab="reviews">Reviews</button></div>
                <section id="admin-products" class="admin-panel">
                    <div class="admin-two">
                        <form id="product-form" class="form-card">
                            <h3 id="product-form-title">Add menu item</h3><input type="hidden" name="id"><label>Dish
                                name<input name="name" required></label><label>Category<select name="category">
                                    <option>Starters</option>
                                    <option>Mains</option>
                                    <option>Desserts</option>
                                    <option>Drinks</option>
                                </select></label><label>Price (PKR)<input name="price" type="number" min="1"
                                    required></label><label>Image URL<input name="image" type="url"
                                    placeholder="https://…"></label><label>Description<textarea name="description"
                                    required rows="3"></textarea></label><label class="checkbox-label"><input
                                    name="featured" type="checkbox"> Feature on home page</label><button
                                class="btn btn-primary" type="submit">Save dish</button><button class="btn btn-quiet"
                                id="product-cancel" type="button">Clear form</button>
                            <p class="form-message" aria-live="polite"></p>
                        </form>
                        <div>
                            <h3>Current menu</h3>
                            <div id="admin-product-list" class="admin-list"></div>
                        </div>
                    </div>
                </section>
                <section id="admin-orders" class="admin-panel" hidden>
                    <h3>Customer orders</h3>
                    <div id="admin-order-list" class="admin-list"></div>
                </section>
                <section id="admin-reservations" class="admin-panel" hidden>
                    <h3>Table reservations</h3>
                    <div id="admin-reservation-list" class="admin-list"></div>
                </section>
                <section id="admin-messages" class="admin-panel" hidden>
                    <h3>Contact messages</h3>
                    <div id="admin-message-list" class="admin-list"></div>
                </section>
                <section id="admin-reviews" class="admin-panel" hidden>
                    <h3>Customer reviews</h3>
                    <div id="admin-review-list" class="admin-list"></div>
                </section>
            </div>
        </section>
    </main>
    <div id="site-footer"></div>
</body>

</html>
