<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Your cart | Saffron & Sage</title>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
    <script defer src="../js/data.js"></script>
    <script defer src="../js/app.js"></script>
    <script defer src="../js/motion.js"></script>
</head>

<body data-page="cart">
    <div id="site-header"></div>
    <main>
        <section class="page-hero">
            <div class="section-kicker">ALMOST THERE</div>
            <h1>Your <em>basket</em></h1>
            <p>Review your items and tell us where to deliver.</p>
        </section>
        <section class="section cart-layout cart-reveal">
            <div id="cart-items"></div>
            <aside class="checkout-card">
                <h2>Order summary</h2>
                <div id="cart-summary"></div>
                <form id="checkout-form">
                    <h3>Delivery details</h3><label>Full name<input name="name" required minlength="2"
                            autocomplete="name"></label><label>Phone<input name="phone" required autocomplete="tel"
                            placeholder="03XXXXXXXXX"></label><label>Delivery address<textarea name="address" required
                            rows="3"></textarea></label><label>Payment method<select name="payment" required>
                            <option value="">Choose payment</option>
                            <option>Cash on delivery</option>
                            <option>Easypaisa / bank transfer (confirm by phone)</option>
                        </select></label><button class="btn btn-primary btn-block" type="submit">Place order</button>
                    <p class="form-message" aria-live="polite"></p>
                </form>
            </aside>
        </section>
    </main>
    <div id="site-footer"></div>
</body>

</html>
